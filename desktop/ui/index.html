<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>órama</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%;
    background: #0a0a0a; color: #e8e8e8;
    font-family: "Fira Code", ui-monospace, Menlo, monospace;
    -webkit-user-select: none; user-select: none; cursor: default;
  }
  main {
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px;
  }
  svg { width: 96px; height: 96px; animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .55; } }
  h1 { margin: 0; font-weight: 500; font-size: 28px; letter-spacing: .02em; }
  #status { margin: 0; font-size: 13px; color: #8a8a8a; min-height: 1.4em; text-align: center; max-width: 520px; padding: 0 16px; }
  #status.error { color: #ff7a1a; }
  #log { display: none; font-size: 12px; color: #8a8a8a; }
  #log.show { display: block; }
</style>
</head>
<body>
<main>
  <svg viewBox="97 48 1083 1083" aria-hidden="true"><path fill="#ff7a1a" fill-rule="evenodd" d="M299 276A392 392 0 0 1 996 266A443 443 0 0 1 299 276ZM374 263A334 334 0 0 1 920 260A346 346 0 0 1 374 263Z"/><path fill="#ff7a1a" d="M644 257L644 1121L154 1121L644 313Z"/><path fill="#ff7a1a" d="M644 313L1124 1121L644 1121Z"/><path fill="#fff" fill-opacity="0.27" d="M644 313L1124 1121L644 1121Z"/><path fill="#ff7a1a" d="M713 168A111 111 0 1 0 738 193A49 20 132 1 1 713 168Z"/></svg>
  <h1>órama</h1>
  <p id="status">Starting…</p>
  <p id="log"></p>
</main>
<script>
  // Called by the app (Rust) while the engine starts.
  window.oramaStatus = function (text, isError, logPath) {
    var s = document.getElementById("status");
    s.textContent = text;
    s.className = isError ? "error" : "";
    var l = document.getElementById("log");
    if (logPath) { l.textContent = "Details: " + logPath; l.className = "show"; }
  };
</script>
</body>
</html>
